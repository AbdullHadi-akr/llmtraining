# Defaults for the PINNmodulusTwo PROFILE EXTENSION (every key is overridable
# on the CLI). train.py reads this in _load_yaml_defaults(); smokeBench.py and
# profileBench.py read the keys they share.
#
# This file is the benchmark configuration: a bare `python3 train.py` trains the
# same model profileBench measures. Keys that exist in PINNmodulusTwo/config.yaml
# keep the same meaning there and here; the block at the bottom is new.

# ---- hardware ---------------------------------------------------------------
device: auto               # auto | cpu | cuda | cuda:N
# TF32 matmuls on Ampere+ GPUs. Off on purpose: the physics residual
# differentiates the network twice and TF32 degrades second derivatives.
tf32: false

# ---- data -------------------------------------------------------------------
# The split lives in op_registry.py (DEFAULT_TRAIN/VAL/TEST_OPS) and is repeated
# here so a run can be re-pointed without editing code. Keep the two in sync, or
# pass --ops/--val-ops/--test-ops explicitly.
ops:      [OP01, OP02, OP03, OP04, OP05, OP07, OP08, OP10, OP11, OP12, OP14]
val_ops:  [OP06, OP09]      # SELECTION set of profileBench
test_ops: [OP13, OP15, OP16]  # report only, never selected on
subsample_time: 2          # dt = 0.1s * subsample -> 0.2s (CFL limit ~0.241s)
train_frac: 0.8            # timeline fraction used for the pooled statistics

# ---- profile preprocessing (NEW) --------------------------------------------
# How the DRIVERS (heat source + config profiles) are reduced onto the
# subsampled grid. 'mean' averages each driver over the raw interval that ends
# at the kept sample -- anti-aliased and, for the heat source, energy-preserving.
# 'point' is the base project's [::N] and is exact only while the drivers are
# constant. Temperature is always point-sampled: it is a state, not a rate.
resample: mean

# Causal rate channels for q_dot and the four profile-capable config channels
# (c_rate, cell_current, fluid_inlet_temp, fluid_mass_flow). Cumulative segment
# lengths in SECONDS, same layout as the temperature history below. Turning this
# off (use_driver_history: false) leaves the model with the instantaneous driver
# values only -- which is the base project's feature set.
use_driver_history: true
driver_rate_lags: [5.0, 20.0]

# ---- model ------------------------------------------------------------------
layer_size: 128
num_layers: 4
k_max: 2                   # raw-mode only
history_mode: hybrid       # raw | hybrid
# TEMPERATURE history segments (the recurrence), in SECONDS. Not a free knob:
# the rate channel is (T_end - T_start) / (lag_n * rate_scale), so the divisor IS
# the RMS of the difference itself, and a short segment amplifies everything --
# signal and an untrained net's jitter alike -- by A = 1/(lag_n * rate_scale).
# At the old [5, 20] that is A ~ 119 in the base project and MORE here, because
# pooling OP01-OP16 widens T_sigma with between-OP offset and so shrinks
# dTdt_scale. train.py prints A at startup. The rule that transfers between
# bundles is "get A to O(1)", not a particular number of seconds.
rate_lags: [200.0, 600.0]
delta_grid: 0.2            # anchor lag of the hybrid temperature history, s
time_deriv: bdf2           # bdf1 | bdf2 | autograd
# Cap on 1/(lag_n * rate_scale) -- the factor by which the hybrid TEMPERATURE
# history magnifies a one-step level jump. 0 = off, which is exactly the base
# project's behaviour and the default here on purpose. It matters more in this
# extension than it did there: pooling OP01-OP16 widens T_sigma with between-OP
# offset that contributes nothing to any OP's own rate, which shrinks
# dTdt_scale and so RAISES that factor. If a run aborts with a non-finite
# L_data in epoch 1, this is the first knob to try (50 is a reasonable start).
# Setting it non-zero makes the model differ from an unguarded run -- say so
# when reporting a result. See data.effective_rate_scale.
max_rate_amp: 0.0

# Predict the absolute temperature, NOT the deviation from a carried level.
#
# This extension never passed residual_output to RecurrentField, so it silently
# ran with the model's old default (true) and had no way to switch it off.
# On, field() returns level(t) + net(...), and
# level(t) ~ level(t - delta_grid) + mean(net) is an integrator of gain exactly 1
# with no leak: any one-signed component of the network output accumulates over
# the trajectory without bound and nothing pulls it back.
#
# Measured in the base project (20 epochs, 3 seeds, no guards) it aborted 9/9 in
# EVERY history configuration -- including raw, which has no rate channels at
# all, which is what identifies the integrator rather than the amplification as
# the primary driver. See PINNmodulusTwo/ARCHITECTURE.md 3.1.
residual_output: false

# Saturate |Tn| in the rollout buffer; 0 disables. With w_phys > 0 this is
# load-bearing, not just a diagnostic: the physics gradient walks the weights out
# of the stable region faster, and in the base project the clamp turned a
# 1-in-3 abort at width 128 / depth 4 into three converging runs.
rollout_clamp: 50.0

use_static: true
use_forcing: true          # NOTE: false also removes every driver rate channel

# ---- optimisation -----------------------------------------------------------
epochs: 60
lr: 2.0e-3
weight_decay: 0.0
# Optimiser steps per OP per epoch, all against that epoch's frozen rollout.
# The rollout is the expensive part (one sequential pass over the trajectory),
# so this raises the update count at roughly constant cost. Mirrors the base
# project; 1 reproduces the old one-update-per-OP behaviour.
inner_steps: 100
gain_lr_mult: 25.0
grad_clip: 1.0             # 0 disables clipping
early_stopping_patience: 0 # 0 disables early stopping
seed: 0
# Reshuffle the OP order every epoch. With 11 heterogeneous OPs and one
# optimiser step per OP, a fixed order lets the last OP always take the last
# step of the epoch.
shuffle_ops: true
# Truncate the TRAINING rollout at split_t so the late window of a training OP
# is genuinely held out. Off by default (parity with PINNmodulusTwo); see the
# README before turning it on -- with CC-CV OPs the late window IS the CV taper.
holdout_tail: false

# ---- loss weights -----------------------------------------------------------
# NOT inherited from PINNmodulusTwo on purpose: phys_scale/Qsrc_scale are fitted
# on a different OP set here, so the same number means a different mixing ratio.
# These are placeholders until profileBench has run -- see the README.
w_data: 1.0
w_phys: 0.1
w_bc: 0.1
phys_norm: 0.0             # 0 = adaptive per-OP EMA, >0 = fixed divisor

# ---- batch sizes ------------------------------------------------------------
batch_data: 2048
batch_phys: 256
batch_bc: 128
