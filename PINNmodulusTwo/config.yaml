# Defaults for PINNmodulusTwo/train.py (every key is overridable on the CLI).
# train.py reads this file in _load_yaml_defaults().
#
# ONE project, ONE config. Until 31.08.2026 there was a constant-driver project
# here and a profile extension next door, each with its own config and its own
# defaults. They are merged: the profile pipeline is a strict superset (a
# constant driver is a profile that does not move), so training on the whole
# plan sheet at once is the only mode. `resample: point` plus
# `use_driver_history: false` reproduces the old constant-only preprocessing if
# a comparison ever needs it.
#
# One caveat when changing a default here: _load_yaml_defaults() swallows every
# error, a missing pyyaml included, and falls back to the literals in
# train.py's argparse. Keep the two in step for anything load-bearing --
# residual_output is the one where the difference is a run that aborts in
# epoch 1 versus one that trains.

# ---- hardware ---------------------------------------------------------------
# ask | auto | cpu | cuda | cuda:N
#
# "ask" lists what this machine has and prompts for one. That is the default
# because the same checkout is run on a laptop CPU and on a GPU server, and the
# wrong choice is a wasted afternoon in either direction -- a run that quietly
# takes the CPU on a GPU box, or one that fails hours in because the card was
# not really visible.
#
# It never blocks a script: with no terminal to ask (CI, nohup, a pipe) it falls
# back to "auto" and says so. Set this to cpu / cuda / auto to skip the prompt
# permanently on a given machine, or pass --device on the command line.
device: ask
# TF32 matmuls on Ampere+ GPUs. Off on purpose: the physics residual
# differentiates the network twice and TF32 degrades second derivatives.
tf32: false

# ---- data: the full plan sheet, OP01-OP16 -----------------------------------
# The split lives in op_registry.py (DEFAULT_TRAIN/VAL/TEST_OPS) and is repeated
# here so a run can be re-pointed without editing code. Keep the two in sync, or
# pass --ops/--val-ops/--test-ops explicitly. The rules the split follows are
# argued out in op_registry.py; the short version:
#   * every profile TYPE a selection OP relies on must occur in training,
#   * selection never touches the extrapolation tier,
#   * every one of OP01-OP16 is used exactly once.
ops:      [OP01, OP02, OP03, OP04, OP05, OP07, OP08, OP10, OP11, OP12, OP14]
val_ops:  [OP06, OP09]        # what a tuning decision may look at
test_ops: [OP13, OP15, OP16]  # report only, read once, never selected on

# The mini-module MEASUREMENT comparison ("Abgleich mit Minimodul-Test" on the
# plan sheet). Rolled out and reported, never trained on, never selected on.
#
#   OP17  DCH, CC 2C          -- a DISCHARGE. OP01-OP16 are all charge.
#   OP18  Fast Charge Lotus   -- charge, V_max 4.3 V
#   OP19  Fahrzyklus TDD.3    -- WLTP (synthetic), mixed
#
# **OP19 exists** and has a row in op_matrix.yaml, so generate_cache.py can
# build it. **OP17 and OP18 have not been simulated yet** -- that is why they
# have no row and no raw export, and it is the only thing missing: nothing in
# the code needs changing when they arrive. Set this to [OP19] once OP19.npz is
# on the machine.
#
# Read the number as "does a model fitted to StarCCM+ agree with a real cell?",
# never as a held-out simulation result: it mixes model error, measurement error
# and the sim-to-test gap with nothing separating them. And expect OP19 to lose
# to the trivial predictors at first -- it is a drive cycle, a regime the model
# has never seen.
#
# Naming an OP here can never break a run: a measurement OP with no cached
# bundle is skipped with a [SKIP] line, unlike ops/val_ops/test_ops, which fail
# fast. So OP19 stays listed even on a machine where it has not been built yet.
measurement_ops: [OP19]

subsample_time: 2          # dt = 0.1s * subsample -> 0.2s (CFL limit ~0.241s)
train_frac: 0.8            # timeline fraction used for the pooled statistics

# ---- driver preprocessing ---------------------------------------------------
# How the DRIVERS (heat source + config profiles) are reduced onto the
# subsampled grid. 'mean' averages each driver over the raw interval that ends
# at the kept sample -- anti-aliased and, for the heat source,
# energy-preserving. 'point' is a plain [::N] and is exact only while the
# drivers are constant, which is why it is no longer the default.
# Temperature is always point-sampled: it is a state, not a rate.
resample: mean

# Causal rate channels for q_dot and the four profile-capable config channels
# (c_rate, cell_current, fluid_inlet_temp, fluid_mass_flow). Cumulative segment
# lengths in SECONDS, same layout as the temperature history below. These are
# EXOGENOUS -- they carry no feedback, so they have none of the amplification
# risk the temperature rate_lags below do.
use_driver_history: true
driver_rate_lags: [5.0, 20.0]

# ---- model ------------------------------------------------------------------
layer_size: 128
num_layers: 4
k_max: 2                   # nur im raw-Modus wirksam
history_mode: hybrid       # raw | hybrid
# Segment lengths of the hybrid history, in SECONDS.
#
# The rate channel is (T_end - T_start) / (lag_n * rate_scale), so a short
# segment divides a small difference by a small number and multiplies everything
# -- signal and an untrained net's jitter alike -- by
#
#     A = 1 / (lag_n * rate_scale)      ~ 119 at 5 s, ~ 3 at 200 s
#
# printed at startup. A large A on its own is NOT what made every run abort:
# that was residual_output (see below). With the integrator gone and
# rollout_clamp on, A ~ 119 is tolerable, and the short segment carries the more
# useful signal -- a rate over 600 s on a ~1474 s trajectory is closer to a
# progress indicator than to a rate.
#
# Measured at the real geometry (n_t = 7000, dTdt_scale 2.467 against the real
# 2.479, so A matches the real 119/30), 10 epochs, 3 seeds, MAE on the held-out
# tail in degrees C:
#
#     [5, 20]      A = 119/30   MAE_test 1.207     <- best on ALL three seeds
#     [50, 150]    A = 12/4     MAE_test 2.102
#     [200, 600]   A = 3/1      MAE_test 2.507
#     raw          --           MAE_test 2.601
#
# No aborts in any of the twelve runs. Longer segments were tried and are worse.
rate_lags: [5.0, 20.0]  # seconds, hybrid history mode only
# Anchor lag of the hybrid history in seconds: the block is
# [T(t-delta_grid), rate_1, ...] and the rate segments cascade back from
# there. Independent of subsample_time - do not confuse the two.
delta_grid: 0.2            # ONLY used when history_mode: hybrid
time_deriv: bdf2           # bdf1 | bdf2 | autograd
use_static: true
use_forcing: true

# --- rollout stability -------------------------------------------------------
# Saturate |Tn| in the rollout buffer; 0 disables. Load-bearing once w_phys > 0.
#
# With the physics term off it is only a diagnostic -- it keeps a runaway rollout
# finite so the log reports HOW MUCH of the trajectory ran away ([SATURATED],
# with a count) instead of a single nan line carrying no information.
#
# With w_phys: 0.1 it is what makes the configuration robust across seeds. The
# physics gradient walks the weights out of the stable region faster, and
# measured over 3 seeds (20 epochs, synthetic bundle):
#
#   residual_output false, [200,600], 128/4   without: ABORT | 0.0023 | 0.0076
#                                             with:    0.0156 | 0.00059 | 0.0135
#   residual_output false, raw,        64/3   without: ABORT | ABORT  | 0.0148
#                                             with:    0.0134 | 0.0095 | 0.0148
#
# It is still not a licence to ignore a persistent [SATURATED] count: falling is
# the model pulling itself together, flat or rising is not.
rollout_clamp: 50.0
max_rate_amp: 0.0          # 0 = rate_scale stays dTdt_scale. >0 caps A by
                           # raising rate_scale, which CHANGES THE MODEL. Prefer
                           # longer rate_lags above; record it if you use this.

# Predict the absolute temperature, NOT the deviation from a carried level.
#
# residual_output: true made field() return level(t) + net(...), where level is
# the spatial mean of the anchor slice. The stated intent was that carrying the
# level stops the rollout drifting. It does the opposite: level(t) ~
# level(t - delta_grid) + mean(net) is an integrator of gain exactly 1 with no
# leak, so any one-signed component of the network output accumulates over the
# ~7000 steps without bound, and nothing pulls it back.
#
# Measured on a synthetic bundle, 20 epochs, 3 seeds, no guards of any kind:
# residual_output: true aborted 9/9 in EVERY history configuration -- hybrid
# with short lags, hybrid with long lags, and raw, which has no rate channels at
# all. With it false, every one of those ran; hybrid + [200, 600] reached
# L_data ~ 1e-4. See ARCHITECTURE.md 3.1.
residual_output: false

# ---- optimisation -----------------------------------------------------------
epochs: 60
# Optimiser steps per OP per epoch, all against that epoch's one frozen rollout.
# The rollout is what costs time; a minibatch step is cheap. At 100 a 60-epoch
# run on 5 OPs takes 30000 Adam steps instead of the 300 it used to take.
# Set to 1 to reproduce the old one-step-per-OP behaviour.
inner_steps: 100
lr: 2.0e-3
weight_decay: 0.0
# src_gain/diff_gain: off by default. physics.py no longer normalises each
# residual term by its own RMS, so there is no scale gap left for them to
# correct -- and free gains can be driven to 0, which satisfies L_phys with a
# constant field instead of a physical one.
learn_gains: false
gain_lr_mult: 25.0         # only applies when learn_gains: true
grad_clip: 1.0             # 0 disables clipping
early_stopping_patience: 0 # 0 disables early stopping
seed: 0
# Reshuffle the OP order every epoch. With a dozen heterogeneous OPs and one
# frozen rollout per OP, a fixed order lets the same OP always take the last
# optimiser step of every epoch.
shuffle_ops: true
# Truncate the TRAINING rollout at split_t so the late window of a training OP
# is genuinely held out. Off by default: with the CC-CV OPs the late window IS
# the CV taper, and dropping it takes the hardest part of the trajectory out of
# training. Turning it on makes op_metrics' `late` column a real held-out
# number for training OPs instead of a relabelled training error.
holdout_tail: false

# ---- loss weights -----------------------------------------------------------
# NOT carried over from the old constant-driver project: phys_scale and
# Qsrc_scale are fitted on a different OP set now, so the same number means a
# different mixing ratio. These are placeholders -- nothing has measured them on
# OP01-OP16.
w_data: 1.0
w_phys: 0.1
w_bc: 0.1

# ---- loss balancing ---------------------------------------------------------
# Each term is divided by an estimate of its own magnitude before its weight is
# applied, so w_data:w_phys:w_bc is a ratio between TERMS and not between their
# accidental units.
#   ema     all three terms, including L_data. The ratio then means the same in
#           epoch 1 and epoch 60.
#   legacy  only L_phys and L_bc, as before. L_data stays raw and falls by
#           orders of magnitude during a run, so the mixture drifts towards
#           physics and the best w_phys becomes a function of `epochs`.
#   fixed   divisors frozen after `balance_warmup` epochs.
# `ema` divides L_data too, so a w_phys measured under the old scheme (L_data
# raw) does not carry over. README.md has the comparison rules and the flags
# that reproduce the old scheme.
loss_balance: ema
ema_decay: 0.9             # per EPOCH; corrected for len(ops) x inner_steps
balance_warmup: 1          # only used by loss_balance: fixed
data_floor: 1.0e-8         # lower bound on the L_data divisor
phys_norm: 0.0             # >0 overrides the L_phys divisor with a constant
bc_norm: 0.0               # >0 overrides the L_bc divisor with a constant

# Residual scaling. phys_scale (and bc_scale) are RMS values, so dividing by the
# scale is what gives mean(res^2) = 1. `legacy` keeps the original division by
# sqrt(scale), which leaves mean(res^2) = scale.
# NOTE: legacy no longer restores the per-TERM size gap between dTdt / aniso /
# Qsrc. The residual is assembled first and divided once, because dividing the
# terms of an equation by different numbers changes the equation instead of
# scaling it (see physics.heat_residual). legacy only restores the old overall
# divisor.
residual_norm: rms
# A loss term with weight 0 still costs a forward pass and an autograd Hessian.
zero_weight_terms: skip    # skip | compute

# ---- batch sizes ------------------------------------------------------------
# On a GPU these can be raised a lot (that is where the speed-up comes from);
# lower them again if you hit "CUDA out of memory".
# batch_data is the number of (time, point) pairs drawn per optimiser step. It
# used to be parsed and then ignored -- the data term ran full-batch over the
# whole trajectory -- so changing it had no effect at all.
batch_data: 2048
batch_phys: 256
batch_bc: 128
