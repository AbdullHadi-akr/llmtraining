seed: 42

data:
  train_ops: [OP01, OP02, OP08, OP09, OP10, OP11, OP12, OP13]
  val_ops: [OP14, OP15]
  test_ops: [OP16, OP19]
  subsample_time: 50
  ts_extrapolation: clamp

model:
  type: mlp_pointwise
  n_hidden_layers: 3
  hidden_size: 128
  swish_beta_init: 1.0
  swish_beta_learnable: true

train:
  epochs: 50
  batch_size: 4096
  lr: 1.0e-3
  weight_decay: 0.0
  grad_clip: 1.0
  early_stopping_patience: 10

loss:
  T_weight: 1.0
  bc_V_weight: 1.0

output:
  ckpt_dir: artifacts/mlp_pointwise/{timestamp}
