seed: 42

data:
  train_ops: [OP01, OP02, OP08, OP09, OP10]
  val_ops: [OP11, OP12]
  test_ops: [OP13, OP14, OP15, OP16, OP19]
  subsample_time: 50
  ts_extrapolation: clamp

model:
  type: recurrent
  rnn_type: gru
  n_layers: 2
  hidden_size: 128
  history_length: 8

train:
  epochs: 50
  batch_size: 8
  lr: 1.0e-3
  weight_decay: 0.0
  grad_clip: 1.0
  early_stopping_patience: 10

loss:
  T_weight: 1.0
  bc_V_weight: 1.0

output:
  ckpt_dir: artifacts/recurrent/{timestamp}

preprocess: null
